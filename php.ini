; php.ini — Railway / FrankenPHP configuration
; Enables required PHP extensions for FRS (RAMSAM System)

extension=mysqli
extension=pdo_mysql
extension=gd
extension=zip
extension=mbstring
extension=fileinfo
extension=exif
extension=intl

; Session settings
session.gc_maxlifetime = 3600
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1

; File uploads
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 60
memory_limit = 256M

; Error display (disable in production)
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
